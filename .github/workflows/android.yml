name: Android checks
on:
  push:
    paths: ['app/**', 'gradle/**', '*.kts', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', '*.kts', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: projector-trace-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/
